[project]
name = "afferent"
version = "0.0.1"
description = "Local-first sensor pipeline (CO2, HRV, keystroke dynamics) exposed to Claude Code or any MCP client"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.3",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "bleak>=3.0.2",
    "polar-python>=1.1.1",
    "numpy>=1.26",
    "pyserial>=3.5",
    "evdev>=1.7",
]

[project.optional-dependencies]
webcam = ["mediapipe>=0.10", "opencv-python>=4.10"]
firmware = ["esptool>=4.8", "mpremote>=1.24"]

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.9", "pytest>=8", "types-pyserial>=3.5", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afferent"]

# `mypy --strict` and `ruff check` run via `make check`.
[tool.mypy]
strict = true
# Matches the interpreter `uv sync` resolves (3.13), not the requires-python
# floor: numpy's bundled stubs use PEP 695 `type` statements, which mypy
# refuses to parse under a 3.11 target.
python_version = "3.13"

# polar-python has no py.typed marker despite being internally type-hinted
# (github.com/zHElEARN/polar-python), so mypy can't see its annotations --
# this is the standard per-module opt-out for that gap, not a project-wide one.
[[tool.mypy.overrides]]
module = "polar_python.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "DTZ", "PIE", "RUF"]
# Test asserts are the point, not a security smell.
per-file-ignores = { "tests/*" = ["S101"] }
