[project]
name = "afferent"
version = "0.0.1"
description = "Local-first closed-loop biofeedback sensor pipeline, exposed to Claude Code (or any MCP client)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.2",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "bleak>=3.0.2",
    "polar-python>=1.1.1",
    "numpy>=1.26",
    "pyserial>=3.5",
]

[project.optional-dependencies]
webcam = ["mediapipe>=0.10", "opencv-python>=4.10"]
firmware = ["esptool>=4.8", "mpremote>=1.24"]

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.9", "pytest>=8", "types-pyserial>=3.5", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afferent"]

# House rule: Python is the named-win exception to Go, on condition it's
# held to Go-level strictness. `mypy --strict` + `ruff check` are the
# enforcement — run both (via `make check`) before considering a change done.
[tool.mypy]
strict = true
# Matches the actual interpreter this project runs under everywhere (no
# .python-version pin; `uv sync` resolves 3.13 here and in CI) -- not the
# requires-python floor above. numpy 2.5's bundled stubs use PEP 695 `type`
# statements unconditionally, which mypy refuses to parse under a 3.11
# target ("Type statement is only supported in Python 3.12 and greater"),
# surfaced now that aggregator.py is the first module to actually import
# numpy.
python_version = "3.13"

# polar-python has no py.typed marker despite being internally type-hinted
# (github.com/zHElEARN/polar-python), so mypy can't see its annotations --
# this is the standard per-module opt-out for that gap, not a project-wide one.
[[tool.mypy.overrides]]
module = "polar_python.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "DTZ", "PIE", "RUF"]
# Test asserts are the point, not a security smell.
per-file-ignores = { "tests/*" = ["S101"] }
