# Local dev only. No auth, no TLS -- never expose this port beyond
# loopback (the README's docker run binds 127.0.0.1:1883, not 0.0.0.0:1883,
# for exactly this reason). A remote/Tailscale broker (see README roadmap)
# needs real auth before it's anything but loopback.
listener 1883
allow_anonymous true
