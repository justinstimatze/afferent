# Local dev only. No auth, no TLS -- never expose this port beyond
# loopback. The bind-to-loopback enforcement point is docker-compose.yml's
# "127.0.0.1:1883:1883" port mapping, NOT this file: Docker's port-publish
# NATs incoming host connections to the container's bridge IP, not its
# loopback, so a listener restricted to 127.0.0.1 *here* would be
# unreachable through that mapping at all rather than more secure --
# confirmed live (2026-09-06): mosquitto's actual established connections
# arrive at the container's bridge IP, never 127.0.0.1. Don't "fix" this by
# adding a loopback bind_address below; harden docker-compose.yml instead.
# A remote/Tailscale broker (see README roadmap) needs real auth before
# it's anything but loopback. Note the aggregator publishes
# state/session/current with retain=True, so any client that ever reaches
# this broker gets the last derived state immediately on connect -- a
# misbinding here is "instant state on touch," not just "live stream."
listener 1883
allow_anonymous true
