# Local use only. No auth, no TLS: never expose this port beyond loopback.
# Loopback is enforced by the "127.0.0.1:1883:1883" port mapping in
# docker-compose.yml, not by this file. Docker forwards host connections to
# the container's bridge IP, so a bind_address of 127.0.0.1 here would make
# the broker unreachable.
# Any local user or process can still connect to a loopback port, so on a
# shared machine add a password_file (allow_anonymous false) first.
# The aggregator publishes state/session/current with retain=True, so any
# client that reaches this broker gets the last derived state on connect.
# A remote broker needs real auth and TLS.
listener 1883
allow_anonymous true
